<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Automation Dashboard Demo</title>
<style>
:root{--brand:#0f9d6b;--ink:#17231f;--mute:#667a72;--bg:#f2f7f5;--line:#dbe8e2}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:26px}.sub{color:var(--mute);margin-bottom:20px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:20px;font-size:14px}
.step{background:#e7f6ef;color:#0b7a53;padding:6px 12px;border-radius:20px;font-weight:600}
.arrow{color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{font-size:28px;display:block}.kpi span{color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:20px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
.btn.g{background:#fff;color:var(--brand);border:1px solid var(--brand)}
form .btn{width:100%;margin-top:16px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:140px}.bar select{width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.hot{background:#fde8e6;color:#c0392b}.warm{background:#fff3da;color:#a66b00}.cold{background:#e8eef7;color:#44618a}
.empty{text-align:center;color:var(--mute);padding:30px}
.log{margin-top:20px;background:#17231f;color:#b9f5d8;border-radius:12px;padding:14px;font:12px/1.6 ui-monospace,Consolas,monospace;max-height:150px;overflow:auto;white-space:pre-wrap}
@media(max-width:860px){.cols,.kpis{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lead Automation Dashboard</h1>
  <p class="sub">Demo: a form submission is scored, tagged and logged automatically – no manual copy-paste.</p>
  <div class="flow"><span class="step">1 Web form</span><span class="arrow">→</span><span class="step">2 Validate</span><span class="arrow">→</span><span class="step">3 Score &amp; tag</span><span class="arrow">→</span><span class="step">4 Save to sheet / CRM</span><span class="arrow">→</span><span class="step">5 Notify team</span></div>

  <div class="kpis">
    <div class="kpi"><b id="k1">0</b><span>Total leads</span></div>
    <div class="kpi"><b id="k2">0</b><span>Hot leads</span></div>
    <div class="kpi"><b id="k3">$0</b><span>Pipeline value</span></div>
    <div class="kpi"><b id="k4">0%</b><span>Hot rate</span></div>
  </div>

  <div class="cols">
    <div class="box">
      <h3>New lead</h3>
      <form id="f">
        <label>Name</label><input id="n" required>
        <label>Email</label><input id="e" type="email" required>
        <label>Company size</label>
        <select id="sz"><option value="1">Just me</option><option value="2">2–10</option><option value="3">11–50</option><option value="4">50+</option></select>
        <label>Budget (USD)</label><input id="b" type="number" min="0" value="500" required>
        <label>Timeline</label>
        <select id="t"><option value="3">ASAP</option><option value="2">This month</option><option value="1">Just exploring</option></select>
        <button class="btn">Submit lead</button>
      </form>
      <button class="btn g" style="width:100%;margin-top:10px" id="seed" type="button">Add 5 sample leads</button>
    </div>
    <div class="box">
      <div class="bar">
        <input id="q" placeholder="Search name or email…">
        <select id="fl"><option value="">All</option><option>Hot</option><option>Warm</option><option>Cold</option></select>
        <button class="btn g" id="csv" type="button">Export CSV</button>
        <button class="btn g" id="clr" type="button">Clear</button>
      </div>
      <table><thead><tr><th>Name</th><th>Email</th><th>Budget</th><th>Score</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table>
      <div class="log" id="log">// automation log</div>
    </div>
  </div>
</div>
<script>
const KEY='leadDemo';let leads=[];
try{leads=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(leads))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(l){let s=0;s+=Math.min(l.budget/100,40);s+=l.size*8;s+=l.time*10;return Math.round(Math.min(s,100))}
const tier=s=>s>=65?'Hot':s>=40?'Warm':'Cold';
function log(m){const l=$('log');l.textContent+='\n['+new Date().toLocaleTimeString()+'] '+m;l.scrollTop=l.scrollHeight}
function add(n,e,sz,b,t){
 const l={n,e,size:+sz,budget:+b,time:+t,at:Date.now()};l.s=score(l);l.tier=tier(l.s);
 leads.unshift(l);save();
 log('Lead received: '+n);log('Scored '+l.s+'/100 → '+l.tier);
 log('Saved to sheet ✓');if(l.tier==='Hot')log('🔔 Slack/email alert sent to sales team');
 render();
}
function render(){
 const q=$('q').value.toLowerCase(),f=$('fl').value;
 const v=leads.filter(l=>(!f||l.tier===f)&&(l.n+l.e).toLowerCase().includes(q));
 $('tb').innerHTML=v.length?v.map(l=>`<tr><td>${esc(l.n)}</td><td>${esc(l.e)}</td><td>$${l.budget.toLocaleString()}</td><td>${l.s}</td><td><span class="tag ${l.tier.toLowerCase()}">${l.tier}</span></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No leads yet – submit the form or add samples.</td></tr>';
 const hot=leads.filter(l=>l.tier==='Hot').length;
 $('k1').textContent=leads.length;$('k2').textContent=hot;
 $('k3').textContent='$'+leads.reduce((a,l)=>a+l.budget,0).toLocaleString();
 $('k4').textContent=leads.length?Math.round(hot/leads.length*100)+'%':'0%';
}
$('f').onsubmit=e=>{e.preventDefault();add($('n').value.trim(),$('e').value.trim(),$('sz').value,$('b').value,$('t').value);e.target.reset();$('b').value=500};
$('seed').onclick=()=>[['Alex Morgan','alex@example.com',4,5000,3],['Sam Lee','sam@example.com',2,800,2],['Jo Rivera','jo@example.com',1,150,1],['Kim Park','kim@example.com',3,2500,3],['Dana Fox','dana@example.com',2,400,1]].forEach(a=>add(...a));
$('clr').onclick=()=>{leads=[];save();log('Data cleared');render()};
$('q').oninput=render;$('fl').onchange=render;
$('csv').onclick=()=>{
 const rows=[['Name','Email','Budget','Score','Status'],...leads.map(l=>[l.n,l.e,l.budget,l.s,l.tier])];
 const c=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='leads.csv';a.click();log('Exported CSV');
};
render();
if(/[?&]demo/.test(location.search)&&!leads.length)$('seed').click();
</script>
</body>
</html>
